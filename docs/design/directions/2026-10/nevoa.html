<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Nulavio · direção Névoa</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
.board{display:flex;flex-direction:column;gap:22px;font-family:"Noto Sans",system-ui,sans-serif}
figure{margin:0}
.cap{margin:0 0 6px;font:600 12px/1.45 "Noto Sans",system-ui,sans-serif;color:var(--foreground,#0B1623)}
.cap span{font-weight:400;color:var(--muted-foreground,#3A6273)}
.foot{font:400 11.5px/1.5 "Noto Sans",system-ui,sans-serif;color:var(--muted-foreground,#3A6273);margin:0}
.z{zoom:var(--z,.55)}
.mono{font-family:"JetBrains Mono","Noto Sans Mono",monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* ---------- theme tokens (Névoa) ---------- */
.lt{--frame:#EAF1F2;--atmo:color-mix(in srgb,var(--id,#EAF1F2) 18%,var(--frame));
 --ink:#0B1623;--ink2:#23495A;--sec:#3A6273;--muted:#4F7383;--line:#BFD0D6;--hair:#D3DFE3;--ctrl:#6B8794;
 --field:#FFFFFF;--surface:#FFFFFF;--sunken:#E2EBEE;--layer:rgba(255,255,255,.62);--track:#E6EEF0;--bubble:#E6EEF1;
 --hover:rgba(11,22,35,.06);--accent:#0F7A68;--accentOn:#FFFFFF;--accentTint:#DDF8F0;--focus:#0F7A68;
 --warn:#8A5A10;--warnTint:#FBEBD3;--crit:#A8323A;--critText:#A8323A;--critTint:#F9DEDF;--critFill:#A8323A;--critOn:#FFFFFF;
 --overlay:rgba(241,247,245,.86);--sheet:#F7FAFA;--codebg:#E6EEF1;--agent:#23495A;--groupc:#185B70;
 --sh1:0 1px 2px rgba(11,22,35,.07);--sh2:0 1px 2px rgba(11,22,35,.05),0 8px 24px rgba(35,73,90,.10);--sh3:0 2px 6px rgba(35,73,90,.08),0 22px 48px rgba(35,73,90,.16);
 --winline:rgba(11,22,35,.20);
 --pg:#FFFFFF;--pgtext:#18212B;--pgtext2:#3B4652;--pgline:#E3E7EB;--pgsel:#BFE0F7;--pgcode:#0F1720;--pgcodet:#E6EDF3;--pgacc:#2457C5;
 color-scheme:light}
.dk{--frame:#08121B;--atmo:color-mix(in srgb,var(--id,#08121B) 13%,var(--frame));
 --ink:#F1F7F5;--ink2:#BFD0D6;--sec:#BFD0D6;--muted:#8FAAB5;--line:#23495A;--hair:#1B3141;--ctrl:#6E93A2;
 --field:#112432;--surface:#112432;--sunken:#070F18;--layer:rgba(24,55,70,.55);--track:#0B1925;--bubble:#183746;
 --hover:rgba(241,247,245,.08);--accent:#6FE0C5;--accentOn:#0B1623;--accentTint:#0E3B33;--focus:#6FE0C5;
 --warn:#E7AE61;--warnTint:#3A2A12;--crit:#E26D70;--critText:#EE8A8C;--critTint:#3F1A1D;--critFill:#E26D70;--critOn:#0B1623;
 --overlay:rgba(17,36,50,.88);--sheet:#0D1C28;--codebg:#183746;--agent:#BFD0D6;--groupc:#7CC4D8;
 --sh1:0 1px 2px rgba(0,0,0,.35);--sh2:0 1px 0 rgba(241,247,245,.04) inset,0 10px 28px rgba(0,0,0,.34);--sh3:0 1px 0 rgba(241,247,245,.05) inset,0 24px 56px rgba(0,0,0,.5);
 --winline:rgba(241,247,245,.14);
 --pg:#11161C;--pgtext:#E3E8EE;--pgtext2:#B6C0CB;--pgline:#232B34;--pgsel:#2C4C68;--pgcode:#0A0E13;--pgcodet:#DCE3EA;--pgacc:#8DB4FF;
 color-scheme:dark}
.noatmo{--atmo:var(--frame)}
.ink-chrome{--atmo:#0B1623}

/* ---------- window ---------- */
.win{position:relative;width:1280px;height:760px;overflow:hidden;border-radius:10px;background:var(--atmo);color:var(--ink);
 font:14px/1.5 "Noto Sans",system-ui,sans-serif;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--winline)}
.tb{height:48px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px 0 9px;color:var(--ink2);position:relative;background:var(--atmo)}
.tb.compact{height:38px}
.wbody{flex:1;display:flex;min-height:0;position:relative}
.tbtn{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.compact .tbtn{width:30px;height:30px;border-radius:10px}
.tbtn.dim{opacity:.45}
.tbtn.on{background:var(--layer)}
.tbtn .bdg{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:3px;background:var(--critFill);color:var(--critOn);display:grid;place-items:center}
.gap8{width:8px;flex:none}
.wctl{display:flex;gap:6px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);height:22px;align-items:center}
.wctl span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}

/* profile chip: the identity corner */
.pchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 5px;border-radius:12px;background:var(--layer);
 color:var(--ink);font:600 13.5px/1 "Noto Sans",system-ui,sans-serif;margin-right:6px;flex:none;white-space:nowrap}
.pchip .pst{display:flex;align-items:center;gap:4px;color:var(--ink2);font-weight:500;font-size:12.5px}
.disc{width:24px;height:24px;border-radius:50%;background:var(--id);color:#070F18;display:grid;place-items:center;position:relative;flex:none;
 box-shadow:inset 0 0 0 1px rgba(7,15,24,.24)}
.disc .ic{width:15px;height:15px;stroke-width:1.9}
.disc.big{width:44px;height:44px}.disc.big .ic{width:24px;height:24px}
.disc.md{width:34px;height:34px}.disc.md .ic{width:19px;height:19px}
.disc.prot{box-shadow:inset 0 0 0 1px rgba(7,15,24,.24),0 0 0 2px var(--ringgap,var(--field)),0 0 0 3.5px var(--ink2)}
.disc.temp{background:var(--field);color:var(--ink);box-shadow:none;border:2px dashed var(--ink2)}
.disc.agent{background:var(--field);color:var(--ink);box-shadow:none;border:4px double var(--agent)}
.disc .lk{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:4px;background:var(--ink);color:var(--field);display:grid;place-items:center}
.disc .lk .ic{width:11px;height:11px;stroke-width:2.2}
.disc.big .lk{width:20px;height:20px;right:-4px;bottom:-4px}.disc.big .lk .ic{width:14px;height:14px}

/* signals: opaque, 4 px corners, glyph + words, no easing */
.seal{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 8px;border-radius:4px;font:600 13px/1 "Noto Sans",system-ui,sans-serif;white-space:nowrap;flex:none}
.compact .seal{height:28px}
.seal.temp{background:var(--field);color:var(--ink);border:2px dashed var(--ink2)}
.seal.priv{background:#F1F7F5;color:#0B1623}
.seal.agent{background:var(--field);color:var(--ink);border:4px double var(--agent);padding:0 4px 0 6px}
.seal.auto{background:var(--critFill);color:var(--critOn)}
.seal.lockd{background:var(--field);color:var(--ink);border:1.5px solid var(--ink)}
.seal.warn{background:var(--warnTint);color:var(--warn);border:1.5px solid var(--warn)}
.seal .sub{font-weight:400}
.seal .sbtn{height:22px;padding:0 8px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.seal.agent .sbtn{background:var(--ink);color:var(--field)}
.band{position:absolute;left:0;right:0;top:0;height:5px;z-index:3}
.band.temp{background:repeating-linear-gradient(90deg,var(--ink2) 0 12px,transparent 12px 20px)}
.band.agent{height:6px;border-top:2px solid var(--agent);border-bottom:2px solid var(--agent)}
.band.auto{height:6px;background:repeating-linear-gradient(-45deg,var(--critFill) 0 7px,var(--critTint) 7px 14px)}
.aframe{position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:10px;box-shadow:inset 0 0 0 2px var(--agent),inset 0 0 0 4px var(--atmo),inset 0 0 0 5px var(--agent)}

/* activity pill (agentic = double rule) */
.act{display:flex;align-items:center;gap:8px;height:32px;padding:0 3px 0 8px;border-radius:4px;border:4px double var(--agent);background:var(--field);
 color:var(--ink);font:600 12.5px/1 "Noto Sans",system-ui,sans-serif;white-space:nowrap;flex:none;margin:0 4px}
.compact .act{height:30px}
.act .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accentTint)}
.act .n{font-weight:400;color:var(--sec)}
.act .ab{height:22px;padding:0 7px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border:1px solid var(--ctrl);color:var(--ink)}
.act .ab.stop{background:var(--accent);color:var(--accentOn);border-color:transparent}

/* address bar */
.url{flex:1;height:34px;border-radius:14px;background:var(--field);border:1px solid var(--ctrl);display:flex;align-items:center;gap:2px;
 padding:0 4px 0 4px;margin:0 6px;min-width:0;color:var(--ink2);position:relative}
.compact .url{height:30px;border-radius:12px}
.url .ib{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--ink2)}
.url .ib .ic{width:17px;height:17px}
.url .txt{flex:1;font:13.5px/1 "JetBrains Mono","Noto Sans Mono",monospace;color:var(--sec);white-space:nowrap;overflow:hidden;padding-left:6px;min-width:0}
.url .txt b{color:var(--ink);font-weight:500}
.url .ph{flex:1;color:var(--sec);font-size:13.5px;padding-left:6px;white-space:nowrap;overflow:hidden}
.url .nvid{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 6px;margin-left:2px;border-radius:7px;background:var(--accentTint);color:var(--accent);font:600 12.5px/1 "Noto Sans",system-ui,sans-serif;flex:none}
.lt .url .nvid{color:#0F7A68}
.url.stripes{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--critFill) 16%,var(--field)) 0 9px,var(--field) 9px 18px)}
.url .eng{display:flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:6px;background:var(--critFill);color:var(--critOn);font:600 12px/1 "Noto Sans",system-ui,sans-serif;flex:none}
.url .ib.hl{background:var(--hover);outline:2px solid var(--focus);outline-offset:1px}

/* strip (collapsed) */
.strip{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px;color:var(--ink2);position:relative}
.stab{width:38px;height:36px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink2);flex:none}
.stab.pin{background:var(--layer)}
.stab.sel{background:var(--field);box-shadow:var(--sh1);color:var(--ink)}
.stab.sel::before{content:"";position:absolute;left:-6px;top:8px;width:3px;height:20px;border-radius:2px;background:var(--accent)}
.stab .ic{width:18px;height:18px}
.stab .mt{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:5px;background:var(--field);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.stab .mt .ic{width:11px;height:11px;stroke-width:2}
.sdiv{width:22px;height:1px;background:var(--line);margin:3px 0;flex:none}
.sgrp{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center}
.sgrp::before{content:"";position:absolute;left:-6px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--groupc)}
.sgl{font:700 10px/1 "Noto Sans",sans-serif;color:var(--groupc);letter-spacing:.02em;height:12px}
.sfill{flex:1}

/* expanded strip: the frosted layer over the page */
.xstrip{position:absolute;left:0;top:0;bottom:0;width:284px;z-index:5;background:var(--overlay);
 -webkit-backdrop-filter:blur(24px) saturate(1.15);backdrop-filter:blur(24px) saturate(1.15);
 border-inline-end:1px solid var(--line);box-shadow:var(--sh3);padding:8px 10px 10px 10px;display:flex;flex-direction:column;gap:2px;
 border-start-end-radius:16px;border-end-end-radius:16px;color:var(--ink2)}
.xstrip.solid{background:var(--frame);-webkit-backdrop-filter:none;backdrop-filter:none}
.xpins{display:flex;gap:6px;margin:0 0 6px}
.xpin{width:78px;height:50px;border-radius:12px;background:var(--layer);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink2);box-shadow:0 0 0 1px var(--line) inset}
.xrow{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 10px;border-radius:12px;color:var(--ink2);font-size:13.5px;white-space:nowrap;position:relative;flex:none}
.xrow .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.xrow .ic{width:17px;height:17px}
.xrow.sel{background:var(--field);color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.xrow.sel::before{content:"";position:absolute;left:-7px;top:7px;width:3px;height:20px;border-radius:2px;background:var(--accent)}
.xrow .tag{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:3px}
.xgh{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;font:600 13px/1 "Noto Sans",sans-serif;color:var(--groupc);flex:none}
.xgh .cnt{margin-left:auto;font-weight:500;color:var(--ink2);font-size:12px}
.xgrp{margin-left:12px;padding-left:8px;border-inline-start:2px solid var(--groupc);display:flex;flex-direction:column;gap:2px}
.xsec{font:500 12px/1 "Noto Sans",sans-serif;color:var(--ink2);padding:8px 10px 4px}
.xfoot{margin-top:auto;display:flex;gap:4px;padding-top:8px;border-top:1px solid var(--line)}

/* content */
.page{flex:1;min-width:0;position:relative;overflow:hidden;border-start-start-radius:12px;border-top:1px solid var(--hair);border-left:1px solid var(--hair);background:var(--pg)}
.page.flat{border-start-start-radius:0}
.site{color:var(--pgtext);font-family:"Noto Sans",system-ui,sans-serif;height:100%}
.site-h{height:54px;display:flex;align-items:center;gap:26px;padding:0 40px;border-bottom:1px solid var(--pgline);font-size:14px;color:var(--pgtext2)}
.site-h .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--pgtext);font-size:15px}
.site-h .logo i{width:18px;height:18px;border-radius:5px;background:var(--pgacc);display:block}
.site-h .ss{margin-left:auto;width:230px;height:32px;border-radius:6px;border:1px solid var(--pgline);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:13px}
.site-m{padding:30px 64px 0;max-width:860px}
.site .bc{font-size:13px;color:var(--pgtext2)}
.site h1{font-size:34px;line-height:1.2;margin:6px 0 10px;font-weight:700;letter-spacing:-.01em}
.site h2{font-size:22px;line-height:1.3;margin:22px 0 6px;font-weight:700}
.site h3{font-size:17px;line-height:1.3;margin:16px 0 4px;font-weight:700}
.site p{font-size:16px;line-height:1.65;margin:0 0 10px;color:var(--pgtext2)}
.site p.lead{font-size:18px;color:var(--pgtext)}
.site pre{background:var(--pgcode);color:var(--pgcodet);border-radius:8px;padding:14px 18px;font:13.5px/1.6 "JetBrains Mono","Noto Sans Mono",monospace;margin:4px 0 10px;white-space:pre}
.site code{font-family:"JetBrains Mono","Noto Sans Mono",monospace;font-size:14px}
.site mark{background:var(--pgsel);color:inherit;border-radius:2px}

/* buttons, fields */
.btn{height:34px;padding:0 14px;border-radius:12px;font:600 13.5px/1 "Noto Sans",system-ui,sans-serif;display:inline-flex;align-items:center;gap:7px;
 border:1px solid var(--ctrl);background:var(--field);color:var(--ink);white-space:nowrap;flex:none}
.btn.pri{background:var(--accent);color:var(--accentOn);border-color:transparent}
.btn.sm{height:30px;padding:0 11px;border-radius:10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.dis{opacity:.45}
.btn .ic{width:16px;height:16px}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--ctrl);border-bottom-width:2px;
 font:500 11.5px/1 "Noto Sans",sans-serif;color:var(--ink);background:var(--field)}
.focusring{outline:2px solid var(--focus);outline-offset:2px}

/* assistant sheet */
.sheet{width:380px;flex:none;background:var(--sheet);border-start-start-radius:16px;border-top:1px solid var(--hair);border-left:1px solid var(--hair);
 display:flex;flex-direction:column;color:var(--ink);min-height:0;position:relative}
.sh-head{padding:14px 12px 8px 18px;display:flex;flex-direction:column;gap:6px}
.sh-row{display:flex;align-items:center;gap:8px}
.sh-title{font:600 15px/1.3 "Noto Sans",sans-serif;display:flex;align-items:center;gap:8px;flex:1}
.sh-recip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sec);line-height:1.3}
.sh-recip b{font-weight:600;color:var(--ink)}
.sh-recip > span:not(.where){white-space:nowrap}
.sh-recip .where{margin-left:auto;height:22px;padding:0 8px;border-radius:6px;background:var(--track);color:var(--ink2);display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;white-space:nowrap}
.sh-recip .host{font-family:"JetBrains Mono","Noto Sans Mono",monospace;color:var(--ink);font-size:12px}
.sh-recip .ic{width:16px;height:16px;color:var(--ink2)}
.seg{margin:2px 18px 6px;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--track);gap:3px}
.seg b{height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px/1 "Noto Sans",sans-serif;color:var(--ink2)}
.seg b.on{background:var(--field);color:var(--ink);box-shadow:var(--sh1);font-weight:600;border:1px solid var(--ctrl)}
.seg b .ic{width:15px;height:15px}
.thread{flex:1;overflow:hidden;padding:8px 18px 8px;display:flex;flex-direction:column;gap:14px;min-height:0}
.mu{align-self:flex-end;max-width:90%;background:var(--bubble);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:14px;line-height:1.45}
.mu .sent{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sec);margin-bottom:5px}
.mu .sent .ic{width:13px;height:13px}
.ma{font-size:14px;line-height:1.6;color:var(--ink)}
.ma p{margin:0 0 6px}
.ma ol{margin:0;padding-left:20px}
.ma li{margin:0 0 4px}
.ma code{font-family:"JetBrains Mono","Noto Sans Mono",monospace;font-size:12.5px;background:var(--codebg);padding:1px 5px;border-radius:4px}
.caret{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-3px;margin-left:2px;border-radius:1px}
.src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sec)}
.src a{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12.5px;background:var(--field)}
.src a .ic{width:13px;height:13px;color:var(--ink2)}
.stream{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sec)}
.stream .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.composer{padding:12px 14px 14px 18px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.ctx-l{font-size:12px;color:var(--sec);display:flex;justify-content:space-between;align-items:center}
.ctx-r{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 2px 0 8px;border-radius:8px;background:var(--field);border:1px solid var(--ctrl);font-size:12.5px;color:var(--ink);white-space:nowrap;max-width:100%}
.cchip .ic{width:14px;height:14px;color:var(--ink2)}
.cchip .n{color:var(--sec)}
.cchip .x{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)}
.cchip .x .ic{width:13px;height:13px}
.cchip.add{border-style:dashed;padding:0 10px 0 8px;color:var(--ink2)}
.cfield{min-height:58px;border-radius:14px;border:1px solid var(--ctrl);background:var(--field);padding:9px 12px;color:var(--sec);font-size:14px}
.cfield.typed{color:var(--ink)}
.cfield.focus{outline:2px solid var(--focus);outline-offset:1px}
.sendr{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--sec);line-height:1.35}
.sendr b{color:var(--ink);font-weight:600}
.sendr .host{font-family:"JetBrains Mono","Noto Sans Mono",monospace;color:var(--ink)}

/* popovers, menus, panels */
.pop{position:absolute;z-index:8;background:var(--surface);border-radius:14px;box-shadow:var(--sh3);border:1px solid var(--line);color:var(--ink)}
.tip{position:absolute;z-index:8;background:var(--ink);color:var(--field);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.35;white-space:nowrap;box-shadow:var(--sh2)}
.toast{position:absolute;z-index:7;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 10px;font-size:12.5px;color:var(--ink);box-shadow:var(--sh2);white-space:nowrap}
.toast .ic{width:15px;height:15px;color:var(--ink2)}
.toast a{color:var(--accent);font-weight:600;text-decoration:none}
.lt .toast a{color:#0F7A68}

/* boards (non-window scenes) */
.bd{position:relative;width:1280px;border-radius:10px;overflow:hidden;color:var(--ink);font:14px/1.5 "Noto Sans",system-ui,sans-serif;background:var(--frame);box-shadow:0 0 0 1px var(--winline)}
.note{font:13px/1.45 "Noto Sans",sans-serif;color:var(--sec)}
.note b{color:var(--ink);font-weight:600}
.h5{font:600 14px/1.3 "Noto Sans",sans-serif;color:var(--ink);margin:0 0 3px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--sh2);border:1px solid var(--hair)}

/* settings */
.set{display:flex;height:100%;background:var(--pg)}
.snav{width:290px;flex:none;padding:22px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--hair)}
.sfield{white-space:nowrap;height:36px;border-radius:12px;border:1px solid var(--ctrl);background:var(--field);display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;color:var(--sec);font-size:13.5px;margin-bottom:14px}
.sfield .ic{width:16px;height:16px;color:var(--ink2)}
.sitem{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:12px;color:var(--ink2);font-size:14px;position:relative}
.sitem .ic{width:18px;height:18px}
.sitem.on{background:var(--accentTint);color:var(--ink);font-weight:600}
.sitem.on::before{content:"";position:absolute;left:-7px;top:9px;width:3px;height:20px;border-radius:2px;background:var(--accent)}
.smain{flex:1;padding:30px 48px 0 56px;max-width:900px;overflow:hidden}
.shd{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.shd h1{font:600 24px/1.2 "Noto Sans",sans-serif;margin:0 0 6px;color:var(--ink)}
.shd p{margin:0;color:var(--sec);font-size:14px;line-height:1.5;max-width:560px}
.plist{padding:4px 0}
.prow{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:66px;border-top:1px solid var(--hair)}
.prow:first-child{border-top:0}
.prow .who{width:236px;flex:none;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14.5px}
.prow .st{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink)}
.prow .st .l{display:flex;align-items:center;gap:7px}
.prow .st .l .ic{width:16px;height:16px;color:var(--ink2)}
.prow .st .s{font-size:12.5px;color:var(--sec);padding-left:23px}
.tagc{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:600 11.5px/1 "Noto Sans",sans-serif;border:1px solid var(--accent);color:var(--accent)}
.lt .tagc{color:#0F7A68;border-color:#0F7A68}
.tagl{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:4px;font:600 11.5px/1 "Noto Sans",sans-serif;background:var(--ink);color:var(--field)}
.tagl .ic,.prow .st .l .tagl .ic{width:12px;height:12px;stroke-width:2.1;color:inherit}
.sub2{font:600 15px/1.3 "Noto Sans",sans-serif;margin:22px 0 8px;color:var(--ink)}
.tgl{width:40px;height:24px;border-radius:12px;background:var(--accent);position:relative;flex:none}
.tgl::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--accentOn)}
.saved{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sec)}
.saved .ic{width:14px;height:14px}

/* new tab */
.nt{height:100%;background:color-mix(in srgb,var(--atmo) 45%,var(--pgbase,#F7FAFA));display:flex;flex-direction:column;align-items:center;padding-top:96px}
.nt .hello{display:flex;align-items:center;gap:16px}
.nt h1{font:600 32px/1.2 "Noto Sans",sans-serif;margin:0;color:var(--ink)}
.nt .who-s{font-size:14px;color:var(--sec);margin-top:6px;display:flex;align-items:center;gap:6px}
.nt .who-s a{color:#0F7A68;font-weight:600;text-decoration:none}
.stline{margin-top:34px;width:640px;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:16px;background:var(--layer);border:1px solid var(--hair);box-shadow:var(--sh1)}
.stline .ic{width:18px;height:18px;color:var(--ink2)}
.stline b{font-weight:600}
.stline .m{color:var(--sec);font-size:13.5px;flex:1}
.routes{margin-top:30px;width:640px}
.routes .rt{font:500 13px/1 "Noto Sans",sans-serif;color:var(--sec);display:flex;justify-content:space-between;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{height:84px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--sh1);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 14px;font-size:13.5px;font-weight:600;color:var(--ink)}
.tile span{font:400 12px/1.2 "JetBrains Mono","Noto Sans Mono",monospace;color:var(--sec)}
.tile .ic{width:18px;height:18px;color:var(--ink2);margin-bottom:2px}
