<!-- UX3G N2: Nulavio's shield for a privacy status that needs attention. It keeps
     the warning meaning of the engine's art (amber, exclamation mark) in the
     status.warning colours of docs/brand/tokens.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="106" viewBox="0 0 100 106" fill="none">
  <style>
    .wash { fill: #FBEBD3; }
    .shield { fill: #FBEBD3; stroke: #8A5A10; }
    .mark { stroke: #8A5A10; }
    .dot { fill: #8A5A10; }
    @media (prefers-color-scheme: dark) {
      .wash { fill: #3A2A12; }
      .shield { fill: #3A2A12; stroke: #E7AE61; }
      .mark { stroke: #E7AE61; }
      .dot { fill: #E7AE61; }
    }
  </style>
  <circle class="wash" cx="56" cy="58" r="44"/>
  <path class="shield" stroke-width="4" stroke-linejoin="round"
        d="M50 10 L84 22 V50 C84 72 70 88 50 96 C30 88 16 72 16 50 V22 Z"/>
  <path class="mark" stroke-width="7" stroke-linecap="round" fill="none" d="M50 32 V58"/>
  <circle class="dot" cx="50" cy="72" r="4.5"/>
</svg>
