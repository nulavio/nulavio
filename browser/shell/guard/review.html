<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="guardTitle"></title>
  <link rel="icon" href="../shared/nulavio-symbol-adaptive.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="review.js"></script>
  <script type="module" src="../lib/moment.js"></script>
</head>
<body data-state="loading">
  <main class="page page--narrow">
    <section class="stack" aria-labelledby="headline">
      <header class="moment__context" data-kind="guard" data-retry="error" data-profile="current"></header>
      <h1 class="warning__headline" id="headline" data-i18n="guardTitle"></h1>
      <p data-i18n="guardIntro"></p>
      <ul class="list stack" id="findings" aria-busy="true"></ul>
      <p class="notice" id="empty" data-i18n="guardEmpty" hidden></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <details class="card why">
        <summary data-i18n="guardLimitsSummary"></summary>
        <p data-i18n="guardLimits"></p>
      </details>
    </section>
  </main>
</body>
</html>
