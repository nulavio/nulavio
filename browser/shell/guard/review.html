<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="guardTitle"></title>
  <link rel="icon" href="../shared/nulavio-symbol-adaptive.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="../lib/appearance.js"></script>
  <script type="module" src="review.js"></script>
  <script type="module" src="../lib/moment.js"></script>
</head>
<body data-state="loading">
  <main class="page page--narrow">
    <section class="stack" aria-labelledby="headline">
      <header class="moment__context" data-kind="guard" data-retry="error" data-profile="current"></header>
      <h1 class="warning__headline" id="headline" data-i18n="guardTitle"></h1>
      <p id="intro" data-i18n="guardIntro"></p>
      <ul class="list stack" id="findings" aria-busy="true"></ul>
      <!-- Nothing to review (audit 2026-11 GUARD-01/03): a neutral empty card, never a green "all safe". -->
      <div class="card stack empty-card" id="empty" hidden>
        <svg class="empty-card__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 8.2 7.5 9.5 4.3-1.3 7.5-5 7.5-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
        <h2 class="card__title" data-i18n="guardEmptyCardTitle"></h2>
        <p class="hint" data-i18n="guardEmpty"></p>
        <div class="actions"><button class="button button--primary" type="button" id="close" data-i18n="guardClose"></button></div>
      </div>
      <p class="status status--toast" id="status" role="status" aria-live="polite"></p>
      <details class="why">
        <summary data-i18n="guardLimitsSummary"></summary>
        <ul>
          <li data-i18n="guardLimit1"></li>
          <li data-i18n="guardLimit2"></li>
          <li data-i18n="guardLimit3"></li>
        </ul>
      </details>
    </section>
  </main>
</body>
</html>
