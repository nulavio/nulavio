<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="assistantTitle"></title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="panel.js"></script>
</head>
<body class="assistant" data-state="loading">
  <main class="stack">
    <h1 class="card__title" data-i18n="assistantTitle"></h1>

    <section class="stack stack--tight assistant__off" id="private" aria-labelledby="private-title" hidden>
      <h2 class="assistant__off-title" id="private-title"><span aria-hidden="true">⊘</span> <span data-i18n="assistantPrivateTitle"></span></h2>
      <p data-i18n="assistantPrivateText"></p>
    </section>

    <section class="stack stack--tight assistant__off" id="blocked" aria-labelledby="blocked-title" hidden>
      <h2 class="assistant__off-title" id="blocked-title"></h2>
      <p id="blocked-text"></p>
      <div class="actions">
        <button class="button button--secondary" type="button" id="resume-settings" data-i18n="assistantOpenSettings"></button>
      </div>
    </section>

    <section class="stack stack--tight" id="setup" hidden>
      <p id="setup-text"></p>
      <div class="actions">
        <button class="button button--secondary" type="button" id="open-settings" data-i18n="assistantOpenSettings"></button>
        <button class="button button--primary" type="button" id="allow-profile" data-i18n="assistantAllowProfile" hidden></button>
      </div>
    </section>

    <form class="stack stack--tight" id="ask" hidden novalidate>
      <fieldset class="segmented">
        <legend class="visually-hidden" data-i18n="assistantModeLegend"></legend>
        <label><input type="radio" name="mode" value="ask" checked> <span data-i18n="assistantModeAsk"></span></label>
        <label><input type="radio" name="mode" value="task"> <span data-i18n="assistantModeTask"></span></label>
      </fieldset>
      <div class="stack stack--tight" id="context">
        <p class="assistant__drift" id="drift" hidden><span aria-hidden="true">ⓘ</span> <span id="drift-text"></span></p>
        <div class="stack stack--tight" id="attached" hidden>
          <p class="hint" id="attached-heading"></p>
          <ul class="assistant__chips" id="chips" aria-labelledby="attached-heading"></ul>
        </div>
        <button class="button button--secondary assistant__offer" type="button" id="include-page" hidden></button>
        <p class="hint" id="no-page" data-i18n="assistantNoPage" hidden></p>
      </div>
      <label class="field"><span class="field__label" id="prompt-label" data-i18n="assistantQuestion"></span>
        <textarea class="input" id="prompt" rows="4" maxlength="8000" required aria-describedby="send-shortcut"></textarea></label>
      <p class="hint" id="task-note" hidden></p>
      <p class="hint hint--on" id="send-line"></p>
      <div class="actions">
        <button class="button button--primary" type="submit" id="send" data-i18n="assistantSend" aria-keyshortcuts="Control+Enter"></button>
        <button class="button button--quiet" type="button" id="summarize" data-i18n="assistantSummarize" hidden></button>
      </div>
      <p class="hint" id="send-shortcut" data-i18n="assistantSendShortcut"></p>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="actions" id="activity-actions" hidden>
      <button class="button button--secondary" type="button" id="open-activity" data-i18n="assistantOpenActivity"></button>
    </div>

    <section class="stack stack--tight" id="answer-section" aria-labelledby="answer-heading" hidden>
      <h2 class="assistant__answer-title" id="answer-heading" data-i18n="assistantAnswerHeading"></h2>
      <div class="assistant__answer" id="answer"></div>
      <div class="callout callout--warning" id="truncated" hidden><p data-i18n="assistantTruncated"></p></div>
      <p class="hint" id="receipt"></p>
      <ol class="hint" id="steps" hidden></ol>
    </section>

    <p class="hint" id="footer"></p>
  </main>
</body>
</html>
