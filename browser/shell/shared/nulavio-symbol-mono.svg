<!-- UX3G: the Nulavio route mark drawn as a 16px tool glyph, like the engine's
     icons: 1.5px stroke, ~14px optical height, one trail dot. It takes its colour
     from the context (hover, disabled, themes, high contrast), never a fixed one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M4 7.25V2l8 12V2" fill="none" stroke="context-fill" stroke-opacity="context-fill-opacity"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="4" cy="12.75" r="1" fill="context-fill" fill-opacity="context-fill-opacity"/>
</svg>
