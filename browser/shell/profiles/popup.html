<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="profilesButton">Profiles</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <!-- UX4 (audit SPA-02/09/17): this window's profile and its state, the others with their
       state and whether they are open, one "Novo perfil…" that opens a create sheet. -->
  <main class="popup__main" id="menu">
    <section aria-labelledby="current-label">
      <h1 class="popup__label" id="current-label" data-i18n="profilesThisWindow">This window</h1>
      <div class="popup__current" id="current"></div>
      <div class="actions" id="current-actions" hidden></div>
    </section>

    <p class="notice" id="unavailable" hidden></p>

    <section id="others-section" aria-labelledby="others-label" hidden>
      <h2 class="popup__label" id="others-label" data-i18n="profilesOpenProfile">Open a profile</h2>
      <!-- Typing a name filters the list (SPA-17); Enter opens the first match, Escape clears -->
      <label class="visually-hidden" for="filter" data-i18n="profilesFilter">Filter profiles</label>
      <input class="input popup__filter" type="search" id="filter" hidden autocomplete="off" spellcheck="false"
             aria-controls="others" data-i18n-attr="placeholder:profilesFilter">
      <ul class="popup__list" id="others"></ul>
      <p class="popup__empty" id="filter-none" role="status" hidden></p>
    </section>

    <section id="site-section" aria-labelledby="site-label" hidden>
      <h2 class="popup__label" id="site-label" data-i18n="routingThisSite">This site</h2>
      <p class="popup__note" id="site-rule"></p>
      <div class="popup__templates" id="site-actions"></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer class="popup__footer">
      <button class="button button--secondary" type="button" id="new-profile" hidden data-i18n="profilesNewSheet">New profile…</button>
      <button class="button button--quiet" type="button" id="new-temporary" data-i18n="profilesTemporaryNew"></button>
      <button class="button button--quiet" type="button" id="manage" data-i18n="profilesManage">Manage profiles</button>
      <button class="button button--quiet" type="button" id="settings" data-i18n="settingsTitle">Nulavio settings</button>
    </footer>
    <details class="popup__why">
      <summary data-i18n="profilesWhy">Why profiles?</summary>
      <p class="popup__note" data-i18n="profilesIsolation"></p>
      <p class="popup__keys" data-i18n="profilesKeyHint"></p>
    </details>
  </main>

  <!-- The create sheet: a template only fills the fields; nothing is created before "Criar". -->
  <form class="popup__main popup__sheet" id="sheet" aria-labelledby="sheet-title" novalidate hidden>
    <h1 class="popup__title" id="sheet-title" data-i18n="profilesNew">New profile</h1>
    <fieldset class="stack stack--tight">
      <legend class="popup__label" data-i18n="profilesTemplates"></legend>
      <div class="popup__templates" id="templates"></div>
    </fieldset>
    <label class="field"><span class="field__label" data-i18n="profilesNameLabel"></span>
      <input class="input" name="name" id="sheet-name" autocomplete="off" maxlength="60" required></label>
    <label class="field"><span class="field__label" data-i18n="profilesIconLabel"></span>
      <select class="select" name="avatar" id="sheet-avatar"></select></label>
    <fieldset class="swatches" id="sheet-colors">
      <legend class="field__label" data-i18n="profilesColorLabel"></legend>
    </fieldset>
    <label class="check">
      <input type="checkbox" name="protect" id="sheet-protect" aria-describedby="sheet-protect-hint">
      <span><span data-i18n="profilesProtectLabel"></span><span class="hint" id="sheet-protect-hint" data-i18n="profilesProtectHint"></span></span>
    </label>
    <p class="form-error" role="alert"></p>
    <div class="actions">
      <button class="button button--primary" type="submit" id="sheet-create" data-i18n="profilesCreateOpen"></button>
      <button class="button button--quiet" type="button" id="sheet-back" data-i18n="profilesBack"></button>
    </div>
  </form>
</body>
</html>
