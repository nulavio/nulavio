<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="routing_ask_title"></title>
  <link rel="icon" href="../shared/nulavio-symbol.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="page.js"></script>
</head>
<body data-mode="ask">
  <main class="page page--narrow">
    <section class="card stack" aria-labelledby="headline">
      <h1 class="warning__headline" id="headline" data-i18n="routing_ask_headline"></h1>
      <p id="explain"></p>
      <div class="target" id="target" hidden></div>
      <p class="url mono" id="url"></p>
      <p class="hint" data-i18n="routingNothingLoaded"></p>
      <div class="actions" id="actions"></div>
      <label class="check" id="remember-field" hidden>
        <input type="checkbox" id="remember">
        <span data-i18n="routingRemember"></span>
      </label>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint"><a href="../settings/settings.html#routing" data-i18n="routingEditRules"></a></p>
    </section>
  </main>
</body>
</html>
