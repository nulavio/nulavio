<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="routing_ask_title"></title>
  <link rel="icon" href="../shared/nulavio-symbol-adaptive.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="../lib/appearance.js"></script>
  <script type="module" src="page.js"></script>
  <script type="module" src="../lib/moment.js"></script>
</head>
<body data-mode="ask">
  <main class="page page--narrow">
    <section class="card stack" aria-labelledby="headline">
      <header class="moment__context" data-kind="routing"></header>
      <h1 class="warning__headline" id="headline" data-i18n="routing_ask_headline"></h1>
      <p id="explain"></p>
      <!-- UX4 (audit SPA-07/08/24): where you are → where the rule sends the link, each with its
           state; the address as text; the option to remember above the buttons it changes. -->
      <div class="route" id="route" hidden>
        <span class="route__end" id="route-from"></span>
        <span class="route__arrow" aria-hidden="true">→</span>
        <span class="route__end" id="route-to"></span>
      </div>
      <p class="url mono" id="url"></p>
      <p class="hint" data-i18n="routingNothingLoaded"></p>
      <label class="check" id="remember-field" hidden>
        <input type="checkbox" id="remember" aria-describedby="remember-hint">
        <span><span id="remember-label"></span><span class="hint" id="remember-hint"></span></span>
      </label>
      <div class="actions" id="actions"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <details class="more" id="why" hidden>
        <summary data-i18n="routingWhy"></summary>
        <p class="hint" id="why-text"></p>
        <p class="hint"><a href="../settings/settings.html#routing" data-settings="routing" data-i18n="routingEditRules"></a></p>
      </details>
      <p class="hint" id="edit-rules"><a href="../settings/settings.html#routing" data-settings="routing" data-i18n="routingEditRules"></a></p>
    </section>
  </main>
</body>
</html>
