<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="phoneTitle"></title>
  <link rel="icon" href="../shared/nulavio-symbol-adaptive.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="../lib/appearance.js"></script>
  <script type="module" src="phone.js"></script>
  <script type="module" src="../lib/moment.js"></script>
</head>
<body data-state="loading">
  <main class="page page--narrow">
    <section class="card stack" aria-labelledby="headline">
      <header class="moment__context" data-kind="phone" data-retry="unavailable"></header>
      <div class="target" id="who"></div>
      <h1 class="warning__headline" id="headline" data-i18n="phoneHeadline"></h1>
      <p id="explain" data-i18n="phoneExplain"></p>
      <ul class="list" id="phones"></ul>
      <form class="stack stack--tight" id="start-form" hidden>
        <label class="field">
          <span class="field__label" data-i18n="phoneCurrentLabel"></span>
          <input class="input" id="current" type="password" autocomplete="current-password" maxlength="1024" required>
        </label>
        <div class="actions"><button class="button button--primary" type="submit" data-i18n="phoneShowCode"></button></div>
      </form>
      <div class="stack stack--tight" id="pairing" hidden>
        <div id="qr" class="qr-box"></div>
        <p id="pair-hint" data-i18n="phoneScanHint"></p>
        <div id="compare" hidden>
          <!-- Focus lands on the digits, not on an answer: both answers weigh the same (SB-07) -->
          <p class="digits mono" id="digits" tabindex="-1" aria-describedby="compare-question"></p>
          <p id="compare-question" data-i18n="phoneCompare"></p>
          <div class="actions">
            <button class="button button--secondary" type="button" id="match" data-i18n="phoneDigitsMatch"></button>
            <button class="button button--secondary" type="button" id="differ" data-i18n="phoneDigitsDiffer"></button>
          </div>
        </div>
        <div class="actions"><button class="button button--quiet" type="button" id="cancel" data-i18n="phoneCancel"></button></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <!-- UX4 (SB-24): every security moment says why it appeared, in the same place -->
      <details class="why">
        <summary data-i18n="momentWhy"></summary>
        <p data-i18n="phoneWhy"></p>
      </details>
      <p class="hint" id="pair-hint-key" data-i18n="phoneKeyHint"></p>
      <!-- The same footer as the other vault pages; it lists the phone among the ways in (SB-13) -->
      <p class="hint" data-i18n="vaultNoMasterKey"></p>
    </section>
  </main>
</body>
</html>
