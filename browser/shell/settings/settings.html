<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="settingsTitle">Nulavio settings</title>
  <link rel="icon" href="../shared/nulavio-symbol-adaptive.svg">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <script type="module" src="../lib/appearance.js"></script>
  <script type="module" src="settings.js"></script>
</head>
<body>
  <div class="settings">
    <!-- UX4 (SPA-04): two panes. The rail lists one section per address (#dns, #routing…),
         grouped by how far a change reaches; the search filters the cards of every section. -->
    <aside class="settings-rail">
      <!-- ADR 0008: this page holds the detail screens of the one settings page; this goes back to it. -->
      <a class="settings-back" id="settings-back" href="#" data-i18n="settingsBack" data-i18n-attr="title:settingsBackHint"></a>
      <label class="settings-search">
        <span class="visually-hidden" data-i18n="settingsSearchLabel"></span>
        <input class="input settings-search__input" type="search" id="settings-search" autocomplete="off"
               spellcheck="false" maxlength="80" aria-controls="settings-main" data-i18n-attr="placeholder:settingsSearchLabel">
      </label>
      <nav class="settings-nav" data-i18n-attr="aria-label:settingsNav">
        <!-- What belonged to "this profile" (layout, look, shortcuts, search, passwords, exceptions, DNS) is drawn
             by the settings page itself now (ADR 0008, ADR 0011): that group of this navigation is gone. -->
        <p class="settings-nav__group" id="nav-all" data-i18n="scopeAllProfiles"></p>
        <ul aria-labelledby="nav-all">
          <!-- Profiles and the routing rules are drawn by the settings page itself now (Perfis e proteção, ADR 0011). -->
          <li><a href="#ai" data-section="ai" data-i18n="aiHeading">AI &amp; Automation</a></li>
        </ul>
        <p class="settings-nav__group" id="nav-computer" data-i18n="scopeComputer"></p>
        <ul aria-labelledby="nav-computer">
          <li><a href="#integrations" data-section="integrations" data-i18n="connectHeading">Integrations</a></li>
        </ul>
      </nav>
    </aside>

  <main class="page page--settings settings-main" id="settings-main">
    <header class="settings-header">
      <h1 class="settings-header__title" data-i18n="settingsTitle">Nulavio settings</h1>
      <!-- SPA-05: which profile is being configured, with its state in words -->
      <p class="settings-where" id="settings-where" hidden></p>
      <p class="settings-header__intro" data-i18n="settingsIntro"></p>
    </header>

    <p class="notice" id="needs-build" hidden data-i18n="settingsNeedsBuild"></p>
    <p class="settings-results" id="settings-results" role="status" aria-live="polite" hidden></p>

    <section class="section" id="layout" aria-labelledby="layout-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="layout-heading" data-i18n="layoutHeading">Layout</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <div class="card stack">
        <p class="hint" id="layout-scope" data-i18n="layoutScope"></p>
        <details class="more" data-open-key="layoutScopeMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="layoutScopeMore"></p></details>
        <!-- The same pictures as the first-run card (audit 2026-11 SET-12); names, values and ids stay. -->
        <fieldset class="layout-options" id="layout-choices" aria-describedby="layout-scope" data-option="layout">
          <legend class="visually-hidden" data-i18n="layoutChoose"></legend>
          <label class="layout-option">
            <svg class="layout-option__preview" viewBox="0 0 160 96" width="160" height="96" aria-hidden="true" focusable="false">
              <rect class="lp-frame" x="0.5" y="0.5" width="159" height="95" rx="8"/>
              <rect class="lp-content" x="50" y="8" width="102" height="80" rx="5"/>
              <rect class="lp-item lp-item--on" x="8" y="10" width="36" height="10" rx="3"/>
              <rect class="lp-mark" x="8" y="12" width="2" height="6" rx="1"/>
              <rect class="lp-item" x="8" y="24" width="36" height="10" rx="3"/>
              <rect class="lp-item" x="8" y="38" width="36" height="10" rx="3"/>
              <rect class="lp-item" x="8" y="52" width="28" height="10" rx="3"/>
            </svg>
            <span class="layout-option__name"><input type="radio" name="layout" value="lateral" aria-describedby="layout-lateral-hint" disabled><span data-i18n="layoutLateral"></span></span>
            <span class="hint layout-option__hint" id="layout-lateral-hint" data-i18n="layoutLateralHint"></span>
          </label>
          <label class="layout-option">
            <svg class="layout-option__preview" viewBox="0 0 160 96" width="160" height="96" aria-hidden="true" focusable="false">
              <rect class="lp-frame" x="0.5" y="0.5" width="159" height="95" rx="8"/>
              <rect class="lp-item lp-item--on" x="8" y="7" width="38" height="11" rx="3"/>
              <rect class="lp-mark" x="12" y="15" width="10" height="2" rx="1"/>
              <rect class="lp-item" x="50" y="7" width="38" height="11" rx="3"/>
              <rect class="lp-item" x="92" y="7" width="30" height="11" rx="3"/>
              <rect class="lp-content" x="8" y="24" width="144" height="64" rx="5"/>
            </svg>
            <span class="layout-option__name"><input type="radio" name="layout" value="top" aria-describedby="layout-top-hint" disabled><span data-i18n="layoutTop"></span></span>
            <span class="hint layout-option__hint" id="layout-top-hint" data-i18n="layoutTopHint"></span>
          </label>
          <label class="layout-option">
            <svg class="layout-option__preview" viewBox="0 0 160 96" width="160" height="96" aria-hidden="true" focusable="false">
              <rect class="lp-frame" x="0.5" y="0.5" width="159" height="95" rx="8"/>
              <rect class="lp-content" x="22" y="8" width="130" height="80" rx="5"/>
              <rect class="lp-item lp-item--on" x="7" y="10" width="10" height="10" rx="3"/>
              <rect class="lp-mark" x="4" y="12" width="2" height="6" rx="1"/>
              <rect class="lp-item" x="7" y="24" width="10" height="10" rx="3"/>
              <rect class="lp-item" x="7" y="38" width="10" height="10" rx="3"/>
            </svg>
            <span class="layout-option__name"><input type="radio" name="layout" value="focus" aria-describedby="layout-focus-hint" disabled><span data-i18n="layoutFocus"></span></span>
            <span class="hint layout-option__hint" id="layout-focus-hint" data-i18n="layoutFocusHint"></span>
          </label>
        </fieldset>
        <p class="hint" id="layout-current" role="status" aria-live="polite" data-i18n="layoutLoading"></p>
        <p class="form-error" id="layout-error" role="alert"></p>
        <!-- ADR 0009: a switch on top of the layout chosen above; off unless the person turns it on. -->
        <div class="stack stack--tight" id="layout-immersive" data-option="immersive">
          <label class="check check--switch">
            <input type="checkbox" role="switch" id="immersive" aria-describedby="immersive-hint" data-focus-key="immersive" disabled>
            <span data-i18n="immersiveLabel"></span>
          </label>
          <p class="hint" id="immersive-hint" data-i18n="immersiveHint"></p>
          <p class="form-error" id="immersive-error" role="alert"></p>
        </div>
        <!-- QA M-2: the first-run choice stays reachable here when the new tab card is not shown -->
        <p class="hint" id="layout-pending" hidden data-i18n="layoutPendingHint"></p>
        <div class="actions">
          <button class="button button--primary" id="layout-keep" type="button" hidden aria-describedby="layout-pending"></button>
          <button class="button button--secondary" id="layout-retry" type="button" hidden data-i18n="layoutRetry"></button>
        </div>
      </div>
    </section>

    <section class="section" id="appearance" aria-labelledby="appearance-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="appearance-heading" data-i18n="appearanceHeading">Appearance</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <div class="card stack">
        <!-- UX6: only Nulavio's own look. No option here can touch a protection (tests/unit/test_personalisation.py). -->
        <p class="hint" data-i18n="appearanceIntro"></p>
        <details class="more" data-open-key="appearanceIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="appearanceIntroMore"></p></details>
        <fieldset class="stack stack--tight" id="appearance-density" data-option="density">
          <legend class="field__label" data-i18n="densityLabel"></legend>
        <label class="check"><input type="radio" name="density" value="auto" data-focus-key="density-auto"> <span><strong data-i18n="densityAuto"></strong><span class="hint" data-i18n="densityAutoHint"></span></span></label>
        <label class="check"><input type="radio" name="density" value="normal" data-focus-key="density-normal"> <span><strong data-i18n="densityNormal"></strong><span class="hint" data-i18n="densityNormalHint"></span></span></label>
        <label class="check"><input type="radio" name="density" value="compact" data-focus-key="density-compact"> <span><strong data-i18n="densityCompact"></strong><span class="hint" data-i18n="densityCompactHint"></span></span></label>
        <label class="check"><input type="radio" name="density" value="touch" data-focus-key="density-touch"> <span><strong data-i18n="densityTouch"></strong><span class="hint" data-i18n="densityTouchHint"></span></span></label>
        </fieldset>
        <fieldset class="stack stack--tight" id="appearance-accent" data-option="accent" aria-describedby="accent-hint">
          <legend class="field__label" data-i18n="accentLabel"></legend>
          <p class="hint" id="accent-hint" data-i18n="accentHint"></p>
          <div class="accent-choices">
            <label class="check accent-choice"><input type="radio" name="accent" value="mint" data-focus-key="accent-mint"><span class="accent-choice__dot" data-accent="mint" aria-hidden="true"></span><span data-i18n="accentMint"></span></label>
            <label class="check accent-choice"><input type="radio" name="accent" value="blue" data-focus-key="accent-blue"><span class="accent-choice__dot" data-accent="blue" aria-hidden="true"></span><span data-i18n="accentBlue"></span></label>
          </div>
        </fieldset>
        <div class="stack stack--tight" id="appearance-contrast" data-option="moreContrast">
          <label class="check check--switch">
            <input type="checkbox" role="switch" id="more-contrast" aria-describedby="more-contrast-hint" data-focus-key="more-contrast">
            <span data-i18n="moreContrastLabel"></span>
          </label>
          <p class="hint" id="more-contrast-hint" data-i18n="moreContrastHint"></p>
          <p class="hint" id="more-contrast-system" data-i18n="moreContrastSystem" hidden></p>
        </div>
        <div class="stack stack--tight" id="appearance-ambience" data-option="newtabAmbience">
          <label class="check check--switch">
            <input type="checkbox" role="switch" id="newtab-ambience" aria-describedby="newtab-ambience-hint" data-focus-key="newtab-ambience">
            <span data-i18n="ambienceLabel"></span>
          </label>
          <p class="hint" id="newtab-ambience-hint" data-i18n="ambienceHint"></p>
        </div>
        <!-- D5: disabled with its reason while nothing is transparent, so it is never a switch that changes nothing. -->
        <label class="check" id="appearance-transparency" data-option="reduceTransparency">
          <input type="checkbox" id="reduce-transparency" aria-describedby="reduce-transparency-why" data-focus-key="reduce-transparency">
          <span><span data-i18n="reduceTransparencyLabel"></span><span class="hint" id="reduce-transparency-why"></span></span>
        </label>
        <p class="hint" id="appearance-locked" data-i18n="appearanceLocked" hidden></p>
      </div>
    </section>

    <section class="section" id="shortcuts" aria-labelledby="shortcuts-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="shortcuts-heading" data-i18n="shortcutsHeading">Shortcuts</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <div class="card stack">
        <p class="hint" data-i18n="shortcutsIntro"></p>
        <details class="more" data-open-key="shortcutsIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="shortcutsIntroMore"></p></details>
        <!-- UX6 (D7): keys change in the engine's extension shortcuts view, which checks clashes. -->
        <ul class="list" id="shortcut-list" data-option="shortcuts"></ul>
        <div class="card__footer">
          <button class="button button--link button--go" type="button" id="shortcuts-browser" data-i18n="shortcutsBrowser"></button>
        </div>
      </div>
    </section>

    <section class="section" id="search" aria-labelledby="search-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="search-heading" data-i18n="searchHeading">Search</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>

      <div class="card stack">
        <div class="field-row">
          <label class="field">
            <span class="field__label" data-i18n="searchDefaultLabel"></span>
            <select class="select" id="default-engine" data-focus-key="default-engine"></select>
          </label>
          <label class="field" id="private-default-field">
            <span class="field__label" data-i18n="searchDefaultPrivateLabel"></span>
            <select class="select" id="default-private-engine" data-focus-key="default-private-engine"></select>
          </label>
        </div>
      </div>

      <div class="card stack">
        <h3 class="card__title" data-i18n="searchEnginesHeading"></h3>
        <p class="hint" data-i18n="searchEnginesNote"></p>
        <ul class="list" id="engines"></ul>
        <label class="check">
          <input type="checkbox" id="suggest-private" data-focus-key="suggest-private">
          <span><span data-i18n="suggestPrivateLabel"></span><span class="hint" id="suggest-private-note" data-i18n="suggestPrivateNote"></span></span>
        </label>
      </div>

      <div class="card stack">
        <h3 class="card__title" data-i18n="addHeading"></h3>

        <div class="stack stack--tight">
          <h4 class="subhead" data-i18n="addProvidersLabel"></h4>
          <div class="actions" id="providers"></div>
          <p class="hint" data-i18n="addProviderKagiNote"></p>
        </div>

        <details class="more" data-open-key="add-advanced">
          <summary data-i18n="addAdvancedSummary"></summary>
          <div class="stack">
        <form class="stack stack--tight" id="add-searxng" novalidate>
          <h4 class="subhead" data-i18n="addSearxngHeading"></h4>
          <label class="field">
            <span class="field__label" data-i18n="addSearxngLabel"></span>
            <input class="input" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                   placeholder="https://searx.example.org/" required>
          </label>
          <p class="hint" data-i18n="addSearxngNote"></p>
          <p class="form-error" role="alert"></p>
          <div class="actions"><button class="button button--secondary" type="submit" data-i18n="addSearxngButton"></button></div>
        </form>

        <form class="stack stack--tight" id="add-custom" novalidate>
          <h4 class="subhead" data-i18n="addCustomHeading"></h4>
          <div class="field-row">
            <label class="field"><span class="field__label" data-i18n="addCustomName"></span>
              <input class="input" name="name" autocomplete="off" maxlength="60" required></label>
            <label class="field"><span class="field__label" data-i18n="addCustomAlias"></span>
              <input class="input" name="alias" autocomplete="off" spellcheck="false" maxlength="21" placeholder="@example"></label>
          </div>
          <label class="field"><span class="field__label" data-i18n="addCustomUrl"></span>
            <input class="input" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                   placeholder="https://example.org/search?q=%s" required></label>
          <label class="field"><span class="field__label" data-i18n="addCustomSuggest"></span>
            <input class="input" name="suggestUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                   placeholder="https://example.org/suggest?q=%s"></label>
          <p class="form-error" role="alert"></p>
          <div class="actions"><button class="button button--secondary" type="submit" data-i18n="addCustomButton"></button></div>
        </form>

        <form class="stack stack--tight" id="add-opensearch" novalidate>
          <h4 class="subhead" data-i18n="addOpenSearchHeading"></h4>
          <label class="field"><span class="field__label" data-i18n="addOpenSearchLabel"></span>
            <input class="input" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                   placeholder="https://example.org/opensearch.xml" required></label>
          <p class="hint" data-i18n="addOpenSearchNote"></p>
          <p class="form-error" role="alert"></p>
          <div class="actions"><button class="button button--secondary" type="submit" data-i18n="addOpenSearchButton"></button></div>
        </form>
          </div>
        </details>
      </div>
    </section>

    <section class="section" id="profiles" aria-labelledby="profiles-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="profiles-heading" data-i18n="profilesHeading">Profiles</h2>
        <p class="scope" data-i18n="scopeAllProfiles"></p>
        <button class="button button--link button--go section__head-end" type="button" id="open-manager" data-i18n="profilesFullManager"></button>
      </div>
      <p class="notice" id="profiles-unavailable" hidden></p>

      <div class="card stack" id="profiles-card">
        <p class="hint" data-i18n="profilesIsolation"></p>
        <ul class="list" id="profile-list"></ul>
        <div class="card__footer" id="profiles-footer"></div>
      </div>

      <div class="card stack" id="profiles-new">
        <h3 class="card__title" data-i18n="profilesNew"></h3>
        <div class="stack stack--tight">
          <h4 class="subhead" data-i18n="profilesTemplates"></h4>
          <div class="actions" id="templates"></div>
          <p class="hint" id="template-hint" aria-live="polite" data-i18n="profilesTemplatesNoteAll"></p>
        </div>
        <form class="stack stack--tight" id="create-profile" novalidate>
          <label class="field"><span class="field__label" data-i18n="profilesNameLabel"></span>
            <input class="input" name="name" autocomplete="off" maxlength="60" required></label>
          <p class="form-error" role="alert"></p>
          <div class="actions">
            <button class="button button--primary" type="submit" data-i18n="profilesCreateButton"></button>
            <a class="button button--secondary" href="../vault/create.html" data-i18n="vaultNewProtected"></a>
          </div>
        </form>
      </div>

      <div class="card stack" id="profiles-temporary">
        <h3 class="card__title" data-i18n="profilesTemporary"></h3>
        <p class="hint" data-i18n="profilesTemporaryAbout"></p>
        <div class="actions">
          <button class="button button--secondary" type="button" id="open-temporary" data-i18n="profilesTemporaryNew"></button>
        </div>
      </div>


      <details class="card why">
        <summary data-i18n="profilesVsContainers"></summary>
        <p data-i18n="profilesVsContainersBody"></p>
      </details>
    </section>

    <section class="section" id="routing" aria-labelledby="routing-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="routing-heading" data-i18n="routingHeading">Smart routing</h2>
        <p class="scope" data-i18n="scopeAllProfiles"></p>
      </div>
      <div class="card stack">
        <p class="hint" data-i18n="routingIntro"></p>
        <details class="more" data-open-key="routingIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="routingIntroMore"></p></details>
        <label class="check check--switch">
          <input type="checkbox" role="switch" id="routing-enabled" data-focus-key="routing-enabled">
          <span data-i18n="routingEnabledLabel"></span>
        </label>
        <label class="check check--switch">
          <input type="checkbox" role="switch" id="routing-in-page" aria-describedby="routing-in-page-hint" data-focus-key="routing-in-page">
          <span data-i18n="routingInPageLabel"></span>
        </label>
        <p class="hint" id="routing-in-page-hint" data-i18n="routingInPageHint"></p>
        <!-- UX6: where links from other apps with no rule open (ADR 0003 step 4, M4a only). -->
        <div class="stack stack--tight" id="routing-fallback-field" data-option="routingFallback">
          <label class="field"><span class="field__label" data-i18n="routingFallbackLabel"></span>
            <select class="select" id="routing-fallback" aria-describedby="routing-fallback-hint" data-focus-key="routing-fallback"></select></label>
          <p class="hint" id="routing-fallback-hint" data-i18n="routingFallbackHint"></p>
          <p class="hint" id="routing-fallback-missing" data-level="warn" hidden data-i18n="routingFallbackMissing"></p>
        </div>
        <ul class="list" id="rules"></ul>
        <div class="empty-state" id="routing-empty" hidden>
          <p class="empty-state__title" data-i18n="routingNeedsTwoTitle"></p>
          <p class="hint" data-i18n="routingNeedsTwoText"></p>
          <div class="actions"><a class="button button--secondary" href="#profiles-new" data-settings="profiles" data-i18n="routingCreateProfile"></a></div>
        </div>
        <form class="stack stack--tight" id="add-rule" novalidate>
          <h4 class="subhead" data-i18n="routingAddHeading"></h4>
          <div class="field-row">
            <label class="field"><span class="field__label" data-i18n="routingSiteLabel"></span>
              <input class="input" name="site" autocomplete="off" spellcheck="false" maxlength="2048"
                     placeholder="example.com" required></label>
            <label class="field"><span class="field__label" data-i18n="routingMatchLabel"></span>
              <select class="select" name="match">
                <option value="domain" data-i18n="routingMatchDomain"></option>
                <option value="host" data-i18n="routingMatchHost"></option>
              </select></label>
          </div>
          <div class="field-row">
            <label class="field"><span class="field__label" data-i18n="routingProfileLabel"></span>
              <select class="select" name="profileId" id="rule-profile"></select></label>
            <label class="field"><span class="field__label" data-i18n="routingActionLabel"></span>
              <select class="select" name="action">
                <option value="open-in" data-i18n="routingActionOpen"></option>
                <option value="ask" data-i18n="routingActionAsk"></option>
                <option value="stay" data-i18n="routingActionStay"></option>
              </select></label>
          </div>
          <p class="form-error" role="alert"></p>
          <div class="actions"><button class="button button--secondary" type="submit" data-i18n="routingAddButton"></button></div>
        </form>
      </div>
    </section>

    <section class="section" id="passwords" aria-labelledby="passwords-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="passwords-heading" data-i18n="passwordsHeading">Passwords</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <div class="card stack">
        <p class="hint" data-i18n="passwordsIntro"></p>
        <details class="more" data-open-key="passwordsIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="passwordsIntroMore"></p></details>
        <ul class="list" id="provider-list" aria-busy="true"></ul>
        <p class="hint" id="engine-logins"></p>
      </div>
      <!-- Look-alike sites the person chose to continue on (flow D), each with a way back (SB-10) -->
      <div class="card stack" id="confirmed-card">
        <h3 class="card__title" id="confirmed-heading" data-i18n="passwordsConfirmedTitle"></h3>
        <p class="hint" data-i18n="passwordsConfirmedIntro"></p>
        <ul class="list" id="confirmed-list" aria-labelledby="confirmed-heading" aria-busy="true"></ul>
        <p class="hint" id="confirmed-empty" data-i18n="passwordsConfirmedNone" hidden></p>
      </div>
    </section>

    <section class="section" id="exceptions" aria-labelledby="exceptions-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="exceptions-heading" data-i18n="exceptionsHeading">Site exceptions</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <div class="card stack">
        <p class="hint" data-i18n="exceptionsIntro"></p>
        <details class="more" data-open-key="exceptionsIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="exceptionsIntroMore"></p></details>
        <ul class="list" id="exception-list" aria-busy="true"></ul>
        <p class="hint" id="exceptions-empty" data-i18n="exceptionsEmpty" hidden></p>
      </div>
      <div class="card stack" id="filter-card">
        <h3 class="card__title" data-i18n="exceptionsFilterTitle"></h3>
        <p class="hint" id="filter-text"></p>
        <div class="actions">
          <button class="button button--secondary" type="button" id="open-filter-list" data-i18n="exceptionsFilterOpen" hidden></button>
        </div>
      </div>
    </section>

    <section class="section" id="dns" aria-labelledby="dns-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="dns-heading" data-i18n="dnsHeading">DNS</h2>
        <p class="scope" data-i18n="scopeProfile"></p>
      </div>
      <form class="card stack" id="dns-form" novalidate>
        <p class="hint" data-i18n="dnsIntro"></p>
        <details class="more" data-open-key="dnsIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="dnsIntroMore"></p></details>
        <p class="notice" id="dns-current" role="status"></p>
        <fieldset class="stack stack--tight">
          <legend class="subhead" data-i18n="dnsChoiceLegend"></legend>
          <!-- Shown, and checked, only while nothing was chosen yet: it saves nothing (audit 2026-11 SET-02). -->
          <label class="check" id="dns-default-option" hidden><input type="radio" name="choice" value="default" data-focus-key="dns-default"> <span><strong data-i18n="dnsDefaultOption"></strong><br><span class="hint" data-i18n="dnsDefaultOptionNote"></span></span></label>
          <label class="check"><input type="radio" name="choice" value="system" data-focus-key="dns-system"> <span><strong data-i18n="dnsSystem"></strong><br><span class="hint" data-i18n="dnsSystemNote"></span></span></label>
          <label class="check"><input type="radio" name="choice" value="fallback" data-focus-key="dns-fallback"> <span><strong data-i18n="dnsFallback"></strong><br><span class="hint" data-i18n="dnsFallbackNote"></span></span></label>
          <label class="check"><input type="radio" name="choice" value="strict" data-focus-key="dns-strict"> <span><strong data-i18n="dnsStrict"></strong><br><span class="hint" data-i18n="dnsStrictNote"></span></span></label>
        </fieldset>
        <div class="field-row" id="dns-provider-row">
          <label class="field"><span class="field__label" data-i18n="dnsProviderLabel"></span>
            <select class="select" name="provider" id="dns-provider">
              <option value="cloudflare" data-i18n="dnsCloudflare"></option>
              <option value="quad9" data-i18n="dnsQuad9"></option>
              <option value="mullvad" data-i18n="dnsMullvad"></option>
              <option value="custom" data-i18n="dnsCustom"></option>
            </select></label>
          <label class="field" id="dns-uri-field"><span class="field__label" data-i18n="dnsUriLabel"></span>
            <input class="input mono" name="uri" id="dns-uri" autocomplete="off" spellcheck="false" maxlength="2048" placeholder="https://"></label>
        </div>
        <p class="hint" data-i18n="dnsThirdParty"></p>
        <p class="form-error" role="alert"></p>
        <div class="actions"><button class="button button--primary" type="submit" id="dns-save" data-i18n="dnsSave"></button></div>
      </form>
    </section>

    <section class="section" id="integrations" aria-labelledby="integrations-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="integrations-heading" data-i18n="connectHeading">Integrations</h2>
        <p class="scope" data-i18n="scopeComputer"></p>
        <button class="button button--secondary section__head-end" type="button" id="connect-refresh" data-i18n="connectRefresh"></button>
      </div>
      <div class="card stack">
        <p class="hint" data-i18n="connectIntro"></p>
        <ul class="list" id="integration-list" aria-busy="true"></ul>
        <!-- What this computer does not have, out of the way but one click from its reasons (audit 2026-11 SET-05). -->
        <details class="more" id="integration-more" data-open-key="integration-more" hidden>
          <summary id="integration-more-summary"></summary>
          <ul class="list" id="integration-unavailable"></ul>
        </details>
      </div>
    </section>
    <section class="section" id="ai" aria-labelledby="ai-heading" hidden>
      <div class="section__head">
        <h2 class="section__title" id="ai-heading" data-i18n="aiHeading">AI &amp; Automation</h2>
        <p class="scope" data-i18n="scopeAllProfiles"></p>
      </div>
      <div class="callout callout--warning" id="ai-stopped" hidden>
        <p data-i18n="aiStoppedBanner"></p>
        <button class="button button--secondary callout__action" type="button" id="ai-resume" data-i18n="aiResume"></button>
      </div>

      <div class="card stack" id="ai-agents-card">
        <p class="hint" data-i18n="aiIntro"></p>
        <details class="more" data-open-key="aiIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="aiIntroMore"></p></details>
        <label class="check check--switch">
          <input type="checkbox" role="switch" id="ai-stop">
          <span><span data-i18n="aiStopLabel"></span><span class="hint" data-i18n="aiStopHint"></span></span>
        </label>
        <ul class="list" id="ai-agents" aria-busy="true"></ul>
      </div>

      <form class="card stack" id="ai-assistant" novalidate>
        <h3 class="card__title" data-i18n="assistantTitle"></h3>
        <p class="hint" data-i18n="assistantIntro"></p>
        <details class="more" data-open-key="assistantIntroMore"><summary data-i18n="howItWorks"></summary><p class="hint" data-i18n="assistantIntroMore"></p></details>
        <p class="notice" id="ai-assistant-state" role="status"></p>
        <!-- One per row: the provider names its examples, which a half-width select cut off (review V10). -->
        <label class="field"><span class="field__label" data-i18n="assistantKindLabel"></span>
          <select class="select" name="kind">
            <option value="openai" data-i18n="assistantKindOpenai"></option>
            <option value="anthropic" data-i18n="assistantKindAnthropic"></option>
          </select></label>
        <label class="field"><span class="field__label" data-i18n="assistantModelLabel"></span>
          <input class="input mono" name="model" autocomplete="off" spellcheck="false" maxlength="200" required></label>
        <label class="field"><span class="field__label" data-i18n="assistantUrlLabel"></span>
          <input class="input mono" name="baseUrl" autocomplete="off" spellcheck="false" maxlength="2048" placeholder="https://api.openai.com/v1" required></label>
        <label class="field"><span class="field__label" data-i18n="assistantKeyLabel"></span>
          <input class="input" name="key" type="password" autocomplete="off" maxlength="512"></label>
        <p class="hint" data-i18n="assistantKeyNote"></p>
        <label class="check check--switch">
          <input type="checkbox" role="switch" name="allowed" id="ai-assistant-allowed">
          <span><span data-i18n="assistantAllowLabel"></span><span class="hint" id="ai-assistant-allowed-hint"></span></span>
        </label>
        <p class="form-error" role="alert"></p>
        <div class="actions">
          <button class="button button--primary" type="submit" data-i18n="assistantSave"></button>
          <button class="button button--quiet" type="button" id="ai-assistant-forget" data-i18n="assistantForget" hidden></button>
        </div>
      </form>

      <div class="card stack" id="ai-connect">
        <h3 class="card__title" data-i18n="aiConnectTitle"></h3>
        <form class="stack" id="ai-connect-form" novalidate>
          <fieldset class="stack stack--tight">
            <legend class="subhead" data-i18n="aiChooseAgent"></legend>
            <div class="actions" id="ai-clients">
              <label class="check"><input type="radio" name="client" value="claude-code" checked><span>Claude Code</span></label>
              <label class="check"><input type="radio" name="client" value="codex"><span>Codex</span></label>
              <label class="check"><input type="radio" name="client" value="other"><span data-i18n="aiOtherClient"></span></label>
            </div>
            <label class="field"><span class="field__label" data-i18n="aiAgentName"></span>
              <input class="input" name="name" maxlength="48" autocomplete="off" required></label>
          </fieldset>
          <fieldset class="stack stack--tight">
            <legend class="subhead" data-i18n="aiChooseAutonomy"></legend>
            <div class="stack stack--tight" id="ai-levels"></div>
          </fieldset>
          <label class="check"><input type="checkbox" name="disposable"><span data-i18n="aiDisposable"></span></label>
          <p class="form-error" role="alert"></p>
          <div class="actions"><button class="button button--primary" type="submit" data-i18n="aiConnectButton"></button></div>
        </form>
        <div class="stack" id="ai-wizard" hidden>
          <p id="ai-wizard-detected"></p>
          <p id="ai-wizard-intro"></p>
          <pre class="notice mono" id="ai-wizard-command"></pre>
          <p class="hint" id="ai-wizard-existing" hidden></p>
          <div class="actions">
            <button class="button button--primary" type="button" id="ai-wizard-install"></button>
            <button class="button button--secondary" type="button" id="ai-wizard-manual" data-i18n="aiShowConfig"></button>
          </div>
        </div>
        <div class="stack" id="ai-connect-result" hidden>
          <p id="ai-config-intro"></p>
          <pre class="notice mono" id="ai-config"></pre>
          <div class="actions">
            <button class="button button--secondary" type="button" id="ai-copy" data-i18n="aiCopy"></button>
            <button class="button button--quiet" type="button" id="ai-connect-again" data-i18n="aiConnectAnother"></button>
          </div>
          <p class="hint" data-i18n="aiConfigOnce"></p>
        </div>
      </div>

      <div class="card stack" id="ai-activity-card">
        <h3 class="card__title" data-i18n="aiActivityTitle"></h3>
        <p class="hint" data-i18n="aiActivityHint"></p>
        <ul class="list" id="ai-activity" aria-busy="true"></ul>
        <div class="actions"><button class="button button--quiet" type="button" id="ai-activity-clear" data-i18n="aiActivityClear"></button></div>
      </div>
    </section>

    <!-- One polite live region. A confirmation tied to a control is shown next to it and only
         spoken here, with the control's name (SPA-06); anything else shows here as a toast. -->
    <p class="status status--toast" id="status" role="status" aria-live="polite" data-inline-anchor></p>
  </main>
  </div>
</body>
</html>
