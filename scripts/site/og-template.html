<!doctype html>
<!-- The link-preview image of nulavio.net (site/assets/og-pt.png, og-en.png; og:image on every page
     without a picture of its own: scripts/site/build_site.py, LINK_PREVIEW, which also holds the
     alternative text, so a text changed here changes there; tests/unit/test_site.py compares them).
     Not published. To regenerate, open this file in any browser at 1200 x 630 with ?lang=pt or ?lang=en
     in the address and capture the viewport as PNG, for example:
       chromium --headless --screenshot=site/assets/og-pt.png --window-size=1200,630 --hide-scrollbars \
         "file://$PWD/scripts/site/og-template.html?lang=pt"
     Then run scripts/brand/build_social.py, which puts both beside GitHub's image on
     docs/brand/assets/social/link-previews.png: look at the small sizes and the crops there.
     Colours and the lockup are the brand's (docs/brand/tokens.json, docs/brand/assets/logo/). The name
     is 264 px wide and the small texts 36 and 34 px: at 300 px wide the name, the headline and the
     address are still read, and the line under the headline, about 9 px tall there, only just.
     The foot carries the address alone: this picture stands for every page without one of its own,
     so it says nothing that is true of one page only (an invitation to the waitlist, for example).
     Noto Sans is asked for first because the committed pictures are set in it: Inter, the brand's
     face for pages, is not bundled, and a host that has it would otherwise draw a different picture. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nulavio link preview</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 64px 72px;
    display: flex; flex-direction: column;
    background: radial-gradient(60% 90% at 88% 100%, #0E3B33, transparent 70%), #0F1C2A;
    color: #F1F7F5; font-family: "Noto Sans", Inter, Cantarell, system-ui, sans-serif;
  }
  img { width: 264px; height: auto; }
  h1 { margin: auto 0 0; font-size: 104px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; }
  h1 span { display: block; }
  h1 .mine { color: #6FE0C5; }
  p { margin: 32px 0 0; font-size: 36px; line-height: 1.3; color: #BFD0D6; }
  .foot { display: flex; align-items: center; gap: 20px; margin-top: 36px; font-size: 34px; font-weight: 600; }
  .trail { display: inline-flex; align-items: center; gap: 10px; }
  .trail i { display: block; border-radius: 50%; background: #6FE0C5; }
  .trail i:nth-child(1) { width: 9px; height: 9px; opacity: .4; }
  .trail i:nth-child(2) { width: 14px; height: 14px; opacity: .7; }
  .trail i:nth-child(3) { width: 19px; height: 19px; }
  [data-lang] { display: none; }
  .pt [data-lang="pt"], .en [data-lang="en"] { display: block; }
  .foot [data-lang] { display: none; }
  .pt .foot [data-lang="pt"], .en .foot [data-lang="en"] { display: inline; }
</style>
</head>
<body>
<img src="../../docs/brand/assets/logo/nulavio-lockup-horizontal-on-dark.svg" alt="Nulavio">
<h1 data-lang="pt"><span>A web é sua.</span><span class="mine">Seus dados também.</span></h1>
<h1 data-lang="en"><span>Your web.</span><span class="mine">Your rules.</span></h1>
<p data-lang="pt">O navegador para Linux que já vem protegido.</p>
<p data-lang="en">The Linux browser that is protected from the start.</p>
<div class="foot"><span class="trail"><i></i><i></i><i></i></span><span data-lang="pt">nulavio.net</span><span data-lang="en">nulavio.net/en</span></div>
<script>document.body.className = new URLSearchParams(location.search).get("lang") === "pt" ? "pt" : "en";</script>
</body>
</html>
