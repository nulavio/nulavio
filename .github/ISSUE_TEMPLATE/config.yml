blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (private)
    url: https://github.com/nulavio/nulavio/security/advisories/new
    about: Report security problems privately, never in a public issue (SECURITY.md).
  - name: Question or idea
    url: https://github.com/nulavio/nulavio/discussions
    about: Questions, feedback on the alpha and ideas that are not yet a feature request.
  - name: Firefox engine bug
    url: https://bugzilla.mozilla.org/
    about: Bugs that also happen in Firefox belong to Mozilla.
