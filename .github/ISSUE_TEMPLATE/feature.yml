name: Feature request
description: Something Nulavio should do. For open questions, Discussions is a better start.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Portuguese. Nulavio has no telemetry and no Nulavio account or server; requests that need them will be declined (CONTRIBUTING.md, "Non-negotiables").
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: false
