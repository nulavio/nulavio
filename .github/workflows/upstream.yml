name: upstream

# Daily check of Mozilla's Firefox releases against the version Nulavio ships
# (update SLA, docs/architecture/update-policy.md). The job fails when the
# 72-hour target has passed, so the maintainers get GitHub's failure notice.
# Reads public release data only; writes nothing to the repository.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with Mozilla's releases
        run: python3 -I scripts/release/watch_upstream.py --summary "$GITHUB_STEP_SUMMARY"
