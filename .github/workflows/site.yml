name: site

# Builds nulavio.net from main, deploys it to Cloudflare Pages (project nulavio, production
# branch main) and checks that the live site serves exactly that build with the headers of
# site/_headers (scripts/site/verify_live.py). It replaces the manual zip upload
# (CONTRIBUTING.md, "Website").
#
# It runs when a push to main changes something scripts/site/build_site.py reads, or by hand
# (Actions -> site -> Run workflow), on main only. The build is the normal one, not --release:
# --release requires the captures to come from the commit being built.
#
# Credentials: the secret CLOUDFLARE_API_TOKEN (an API token limited to
# "Account / Cloudflare Pages / Edit" on the account that owns the project) of the environment
# "site", which accepts only main, and the repository variable CLOUDFLARE_ACCOUNT_ID. A workflow
# pushed on another branch cannot read an environment's secret (#182). Only the deploy step
# receives them. This workflow never runs pull request code: it has no pull_request trigger,
# and fork workflows are off.
# wrangler comes from ci/site/package-lock.json: exact versions, integrity-checked by npm ci,
# installed without running install scripts.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/**"
      - "browser/startpage/tokens.css"
      - "docs/brand/assets/**"
      - "browser/build/engine.json"
      - "packaging/release.json" # published version and download links
      - "browser/patches/series"
      - "browser/distribution/extensions.lock.json"
      - "launcher/**" # the prefs explain excerpt on the page
      - "ci/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

# Deploys run one at a time, in order; a newer push never stops a deploy halfway.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: build, deploy and check nulavio.net
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build reads the commits and dates of the captures
      - name: Build the site
        run: python3 -I scripts/site/build_site.py --out "$RUNNER_TEMP/site"
      - name: Site unit tests
        run: python3 -I -m unittest discover -s tests/unit -t tests/unit -p test_site.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install wrangler (ci/site/package-lock.json, no install scripts)
        run: |
          mkdir "$RUNNER_TEMP/wrangler"
          cp ci/site/package.json ci/site/package-lock.json "$RUNNER_TEMP/wrangler/"
          npm ci --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/site" \
            --project-name nulavio --branch main --commit-dirty=false \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
      - name: The live site serves this build
        run: python3 -I scripts/site/verify_live.py "$RUNNER_TEMP/site"
