name: release

# Build, test, package and publish the Firefox release that main pins
# (browser/build/engine.json). Manual, from main only; one run at a time.
#
# 1. build (Blacksmith, 16 vCPU / 64 GiB, environment `build`: main only, holds the
#    Google Safe Browsing key): scripts/release/rehearse_release.sh with the runner
#    budget (NULAVIO_BUILD_PROFILE=runner, docs/architecture/build.md): verified
#    source, build, unit and integration tests, RPM and .deb checked in clean
#    containers, the signed-repository checks, SBOMs, manifest.json. The packages and
#    the manifest get a GitHub build-provenance attestation.
# 2. publish (GitHub-hosted, environment `release`: the maintainer approves, main
#    only): checks the attestation, then scripts/release/publish_release.sh signs
#    through AWS KMS (OIDC; ci/aws/), uploads the dnf repository to R2 (packages
#    first, signed metadata last), installs from https://nulavio.net/rpm/nulavio.repo
#    in a clean Fedora container with both signature checks on, attests the signed
#    files and drafts the GitHub release. The maintainer reviews and publishes the
#    draft, then does the steps in the job summary (release.json, site, changelog).
#
# 3. flatpak (GitHub-hosted, no secrets): builds net.nulavio.Nulavio from the portable
#    archive with Flathub's builder, lints it, starts it in the sandbox and bundles it
#    (nulavio-<version>.x86_64.flatpak); publish signs and attests the bundle with the
#    other assets when this job passed, and goes on without it when it did not
#    (packaging/flatpak/, docs/architecture/build.md#flatpak-flathub).
#
# The signing job never runs on the build machine: Blacksmith sees the code and the
# Safe Browsing key (it ships inside the browser anyway), never the release key or
# the upload token. "publish: false" stops after the build (a rehearsal in CI).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign and publish after the build (asks for approval)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build, test and package (Blacksmith)
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment: build
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write # signs the build-provenance attestation (Sigstore)
      attestations: write # stores it with the repository
    outputs:
      firefox: ${{ steps.pin.outputs.firefox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the next package release is counted from the tags
      - name: Pinned Firefox release
        id: pin
        run: python3 -I -c 'import json; print("firefox=" + json.load(open("browser/build/engine.json"))["firefox"])' >> "$GITHUB_OUTPUT"
      - name: libsodium and gocryptfs for the Vault tests (decisions D1, D2)
        run: scripts/ci/apt_install.sh libsodium23 gocryptfs fuse3
      - name: Google Safe Browsing key (file mode 0600, read by build_nulavio.sh)
        env:
          KEY: ${{ secrets.GOOGLE_SAFEBROWSING_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the build environment has no GOOGLE_SAFEBROWSING_API_KEY"; exit 1; }
          umask 077
          mkdir -p "$HOME/.config/nulavio-build"
          printf '%s' "$KEY" > "$HOME/.config/nulavio-build/google-safebrowsing.key"
      - name: Rehearse the release (build, tests, packages, checks, manifest)
        env:
          FIREFOX: ${{ steps.pin.outputs.firefox }}
          NULAVIO_BUILD_PROFILE: runner
          NULAVIO_INTEGRATION_IMAGE: fedora-release-itest # the gallery baselines' fonts (run_integration.sh)
        run: scripts/release/rehearse_release.sh "$FIREFOX" "$RUNNER_TEMP/rehearsal"
      - name: Remove the Safe Browsing key
        if: always()
        run: rm -f "$HOME/.config/nulavio-build/google-safebrowsing.key"
      - name: Report and logs
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/rehearsal/rehearsal.md" ] && cat "$RUNNER_TEMP/rehearsal/rehearsal.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/rehearsal/logs"
          cp -r "$HOME/.cache/nulavio-build/logs/." "$RUNNER_TEMP/rehearsal/logs/build-guard/" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rehearsal-logs
          path: |
            ${{ runner.temp }}/rehearsal/rehearsal.md
            ${{ runner.temp }}/rehearsal/logs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/rehearsal/packages/x86_64/nulavio-*.rpm
            ${{ runner.temp }}/rehearsal/packages/nulavio_*.deb
            ${{ runner.temp }}/rehearsal/packages/nulavio-*.linux-x86_64.tar.xz
            ${{ runner.temp }}/rehearsal/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: |
            ${{ runner.temp }}/rehearsal/manifest.json
            ${{ runner.temp }}/rehearsal/rehearsal.md
            ${{ runner.temp }}/rehearsal/packages/
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak from the portable archive (build, Flathub's linter, bundle)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # nothing more: Flathub's builder runs here, and must not be able to attest anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: ${{ runner.temp }}/rehearsal
      - name: Flatpak and Flathub's builder (org.flatpak.Builder, with flatpak-builder-lint)
        run: |
          scripts/ci/apt_install.sh flatpak dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Build and install net.nulavio.Nulavio from the archive this run built
        run: |
          archive=$(find "$RUNNER_TEMP/rehearsal/packages" -maxdepth 1 -name 'nulavio-*.linux-x86_64.tar.xz')
          python3 -I scripts/release/flatpak_manifest.py --archive "$archive" --out "$RUNNER_TEMP/flatpak"
          cd "$RUNNER_TEMP/flatpak"
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest net.nulavio.Nulavio.json
          # As Flathub builds (flathub-build): absolute media URLs, which the repo linter requires.
          dbus-run-session -- flatpak run org.flatpak.Builder --user --sandbox --disable-rofiles-fuse --force-clean --install --install-deps-from=flathub \
            --mirror-screenshots-url=https://dl.flathub.org/media --compose-url-policy=full --repo=repo builddir net.nulavio.Nulavio.json
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
      - name: The browser starts in the sandbox and renders a page
        run: scripts/release/check_flatpak.sh
      - name: Bundle (a release asset; installing it adds Flathub for the runtime)
        run: |
          archive=$(find "$RUNNER_TEMP/rehearsal/packages" -maxdepth 1 -name 'nulavio-*.linux-x86_64.tar.xz')
          mkdir -p "$RUNNER_TEMP/bundle"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo "$RUNNER_TEMP/flatpak/repo" \
            "$RUNNER_TEMP/bundle/$(basename "$archive" .linux-x86_64.tar.xz).x86_64.flatpak" net.nulavio.Nulavio master
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-bundle
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: sign through KMS and publish (maintainer approval)
    needs: [build, flatpak]
    # A failed Flatpak never holds back a release (a security update has a deadline): it goes out without the bundle.
    if: ${{ !cancelled() && inputs.publish && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write # the draft GitHub release
      id-token: write # OIDC to AWS (KMS signing role, ci/aws/) and the attestation of the signed files
      attestations: write # stores that attestation
    env:
      FINGERPRINT: 298A9093BAABB26F79BB29F4BF47E5FA9EDB8DB1 # site/keys/nulavio-packages.asc; publish_release.sh checks it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # publish_release.sh checks the base commit is on main and the tag is new
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: ${{ runner.temp }}/rehearsal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.flatpak.result == 'success'
        with:
          name: flatpak-bundle
          path: ${{ runner.temp }}/flatpak-bundle
      - name: The packages and the manifest come from this workflow on main (provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$RUNNER_TEMP/rehearsal
          for file in "$OUT"/manifest.json "$OUT"/packages/x86_64/nulavio-*.rpm "$OUT"/packages/nulavio_*.deb \
              "$OUT"/packages/nulavio-*.linux-x86_64.tar.xz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main >/dev/null
            echo "provenance ok: ${file#"$OUT"/}"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.NULAVIO_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.NULAVIO_AWS_REGION }}
          role-session-name: nulavio-release
      - name: Sign through KMS and stage (publish_release.sh)
        env:
          NULAVIO_KMS_KEY_ID: ${{ vars.NULAVIO_KMS_KEY_ARN }}
        run: |
          python3 -I scripts/release/release_manifest.py verify "$RUNNER_TEMP/rehearsal" --repo . > "$RUNNER_TEMP/release.json"
          bundle=$(find "$RUNNER_TEMP/flatpak-bundle" -maxdepth 1 -name '*.flatpak' 2>/dev/null || true)
          [ -n "$bundle" ] || echo "::warning::the Flatpak job failed: this release has no Flatpak bundle"
          NULAVIO_FLATPAK_BUNDLE=$bundle scripts/release/publish_release.sh "$RUNNER_TEMP/rehearsal" "$FINGERPRINT" "$RUNNER_TEMP/publish"
      - name: Upload the dnf repository to R2 (packages first, signed metadata last)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/release/upload_repo.sh "$RUNNER_TEMP/publish/rpm"
      - name: Install from https://nulavio.net/rpm/nulavio.repo in a clean Fedora (both checks on)
        run: |
          tag=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/release.json")
          scripts/release/check_published.sh "${tag#v}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publish/github/*
      - name: Flathub manifest for this release (downloads the archive from the GitHub release)
        run: |
          archive=$(find "$RUNNER_TEMP/publish/github" -maxdepth 1 -name 'nulavio-*.linux-x86_64.tar.xz')
          python3 -I scripts/release/flatpak_manifest.py --archive "$archive" --url --out "$RUNNER_TEMP/flathub"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag firefox commit < <(python3 -I -c 'import json, sys; r = json.load(open(sys.argv[1])); print(r["tag"], r["firefox"], r["commit"])' "$RUNNER_TEMP/release.json")
          {
            printf 'Nulavio %s, built from Firefox %s (commit %s).\n\n' "${tag#v}" "$firefox" "${commit:0:12}"
            printf 'Install or upgrade on Fedora: https://nulavio.net/en/download/\n\n'
            if bundle=$(cd "$RUNNER_TEMP/publish/github" && ls -- *.flatpak 2>/dev/null); then
              printf 'Other distributions, with Flatpak (to update, install the next release the same way):\n\n    flatpak install --user %s\n\n' "$bundle"
            fi
            printf 'Every file here is signed (SHA256SUMS.asc, key %s) and has a GitHub build-provenance attestation:\n\n' "$FINGERPRINT"
            printf '    gh attestation verify <file> --repo %s\n\n' "$GITHUB_REPOSITORY"
            printf 'Built and tested by run %s/%s/actions/runs/%s.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --draft --prerelease --target "$commit" \
            --title "Nulavio ${tag#v} (alpha)" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/publish/github/*
          {
            printf '## %s is live in the dnf repository; the GitHub release is a draft\n\n' "$tag"
            printf '1. Review and publish the draft release %s (creates the tag).\n' "$tag"
            printf '2. Set "version" in packaging/release.json to %s (pull request); the site workflow rebuilds the download pages.\n' "${tag#v}"
            printf '3. Add the entry to docs/security/changelog.md (hours to "published").\n'
            printf '4. Flathub: copy the flathub/ folder of the "published" artifact into the net.nulavio.Nulavio repository (pull request).\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published
          path: |
            ${{ runner.temp }}/publish/
            ${{ runner.temp }}/flathub/
          if-no-files-found: ignore
          retention-days: 90
