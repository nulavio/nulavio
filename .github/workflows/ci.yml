name: ci

# No paths-ignore for documentation-only changes: the unit tests read docs/ (design
# tokens, links, claims), so such a change can fail them (docs/security/code-scanning.md).
# The engine integration matrix, the most expensive job, is skipped when only Markdown
# files, which no integration test reads, changed since the last tested tree (job `changes`).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # weekly: catch engine / AMO / upstream drift

permissions:
  contents: read

# A newer push cancels the run of the previous one (the gate in job `changes` then compares
# with the last successful run, not with the previous push); a push never cancels the weekly run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, unit tests, generated files, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conventional Commit title (the squash commit and release-note input)
        if: github.event_name == 'pull_request'
        run: python3 -I scripts/release/release_notes.py check-title
      - name: Lint (ruff, hash-pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements/dev.txt
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Generated tokens are current
        run: python3 -I scripts/brand/build_tokens.py --check
      - name: WCAG contrast of design tokens
        run: python3 -I scripts/brand/contrast.py
      - name: libsodium and gocryptfs for the Vault tests (decisions D1, D2)
        run: scripts/ci/apt_install.sh libsodium23 gocryptfs fuse3
      - name: Gradle wrapper JAR is an official Gradle release (Dependabot replaces it on wrapper updates)
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Companion protocol library (Java; Gradle and dependencies checksum-verified)
        run: JAVA_HOME="$JAVA_HOME_21_X64" android/gradlew -p android --no-daemon -q :nv1:test
      - name: uBlock Origin's list registry is the pinned package's (fetched from AMO, checked against the lock)
        run: python3 -I scripts/upstream/refresh_extensions_lock.py --check-registry
      - name: Unit tests
        env:
          NULAVIO_REQUIRE_SODIUM: "1"
          NULAVIO_REQUIRE_GOCRYPTFS: "1"
        run: python3 -I tests/run.py unit
      - name: Pinned Firefox source digest is the one Mozilla signed (engine.json)
        if: ${{ !cancelled() }} # reported even when an earlier step failed
        run: python3 -I scripts/release/bump_engine.py --check
      - name: SBOM (CycloneDX; the Companion app's from android/app/gradle.lockfile)
        if: ${{ !cancelled() }}
        run: |
          python3 -I scripts/release/sbom.py > sbom.cdx.json
          python3 -I scripts/release/sbom.py --companion > companion.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: |
            sbom.cdx.json
            companion.cdx.json
          retention-days: 14 # artifacts count against the plan's storage; releases keep their own SBOM
      - name: Pinned dependencies against OSV.dev, the AMO blocklist and the registries (daily in upstream.yml too)
        if: ${{ !cancelled() }} # reported even when an earlier step failed
        run: |
          status=0
          python3 -I scripts/release/watch_dependencies.py --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Dependency watch::some data could not be fetched; the daily upstream run fails on this"
            exit 0
          fi
          exit "$status"

  security:
    name: security scanners (workflows, secrets, shell scripts, Nulavio rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads every commit
      - name: Fetch the scanners (exact versions, SHA-256 checked; scripts/security/fetch_tools.sh)
        id: fetch
        run: scripts/security/fetch_tools.sh "$RUNNER_TEMP/nulavio-security-tools"
      # Each check runs even when an earlier one failed, so one run shows every finding.
      - name: Workflows (actionlint, with ShellCheck on run blocks)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: scripts/security/scan.sh actionlint
      - name: Workflow security audits (zizmor)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          # Read-only job token, only for zizmor's online audits: is each pinned SHA a
          # commit of the action's own repository, and does the action have a known advisory.
          GH_TOKEN: ${{ github.token }}
        run: scripts/security/scan.sh zizmor
      - name: Secrets in every commit (gitleaks)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: scripts/security/scan.sh gitleaks
      - name: The secret scan reads merges, type changes and binary key files (scanner wiring tests)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          NULAVIO_REQUIRE_SECURITY_TOOLS: "1" # fail, never skip, if the scanners were not fetched
        run: python3 -I -m unittest discover -s tests/unit -t tests/unit -p test_security_tooling.py -k GitleaksHistoryTest
      - name: Shell scripts (ShellCheck)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: scripts/security/scan.sh shellcheck
      - name: Nulavio rules (Opengrep, ci/sast/nulavio-rules.yml) and their test cases
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: scripts/security/scan.sh opengrep-rules opengrep

  companion:
    name: Companion app (lint, release build)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }} # drafts get the quick checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle wrapper JAR is an official Gradle release (Dependabot replaces it on wrapper updates)
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint and release build (Gradle and dependencies checksum-verified; no signing key in CI)
        run: JAVA_HOME="$JAVA_HOME_21_X64" android/gradlew -p android --no-daemon -q :app:lintDebug :app:assembleRelease

  changes:
    name: does this change need the engine integration run
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }} # drafts get the quick checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the last successful ci run on main (scripts/ci/needs_integration.py)
    outputs:
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Files changed since the last tested tree
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/needs_integration.py >> "$GITHUB_OUTPUT"

  integration:
    name: engine integration (${{ matrix.image }}, headless)
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # fedora-itest: distribution Firefox RPM + KeePassXC (provider spike).
        # ubuntu-itest: Mozilla's own Firefox build from its APT repository.
        image: [fedora-itest, ubuntu-itest]
    env:
      IMAGE: ${{ matrix.image }} # used as "$IMAGE" in run blocks, never expanded into the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build test image (packages installed inside the container only)
        run: docker build -t "nulavio-$IMAGE" -f "ci/containers/$IMAGE.Containerfile" ci/containers
      - name: Integration tests as an unprivileged user (incl. official password-manager extensions)
        # Docker's default seccomp profile blocks the user namespaces that the
        # browser's own content sandbox needs. Relaxing the *container* filter
        # lets the *browser* sandbox run fully; test_04 then verifies it.
        # (Rootless podman passes with its default profile; see ADR 0001 E15.)
        run: |
          mkdir -p artifacts && chmod 777 artifacts
          docker run --rm --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE":/src:ro -v "$GITHUB_WORKSPACE/artifacts":/artifacts \
            -e NULAVIO_NETWORK_TESTS=1 -e NULAVIO_TEST_ARTIFACTS=/artifacts \
            "nulavio-$IMAGE" \
            sh -c 'cp -r /src "$HOME/nulavio" && cd "$HOME/nulavio" && python3 -I tests/run.py integration'
      - name: KeePassXC native messaging end to end (throwaway database)
        if: matrix.image == 'fedora-itest'
        run: |
          docker run --rm --security-opt seccomp=unconfined -v "$GITHUB_WORKSPACE":/src:ro "nulavio-$IMAGE" \
            sh -c 'cp -r /src "$HOME/nulavio" && cd "$HOME/nulavio" && python3 -I scripts/research/keepassxc_native_messaging_spike.py'
      - name: Verify Mozilla release signature for the tested engine version
        run: |
          version=$(docker run --rm "nulavio-$IMAGE" sh -c 'firefox --version 2>/dev/null' | awk '{print $3}')
          python3 -I scripts/upstream/verify_firefox_release.py "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-artifacts-${{ matrix.image }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7 # screenshots and logs for debugging a run
